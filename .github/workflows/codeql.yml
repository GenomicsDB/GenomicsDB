# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**/CMakeLists.txt'
      - 'pom.xml'
      - 'src/main/**'
      - 'src/resources/**'
      - '.github/resources/codeql-config.yml'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**/CMakeLists.txt'
      - 'pom.xml'
      - 'src/main/**'
      - 'src/resources/**'
      - '.github/resources/codeql-config.yml'
      - '.github/workflows/codeql.yml'

# A new push to a pull request cancels the checks still running for its previous push; pushes to branches are
# never grouped, so each runs to completion
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  PREREQS_ENV: ${{github.workspace}}/prereqs.sh
  PREREQS_INSTALL_DIR: ${{github.workspace}}/prereqs
  CMAKE_INSTALL_PREFIX: ${{github.workspace}}/install
  GENOMICSDB_BUILD_DIR: ${{github.workspace}}/build

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
      # Learn more about CodeQL language support at https://git.io/codeql-language-support

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-package: jdk
        java-version: '17'

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        config-file: ./.github/resources/codeql-config.yml
        languages: cpp, java
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    # deps/ holds a directory per compiler, which can change with the runner image, so each image gets its own
    # cache, starting from the previous image's
    - name: Get the runner image version
      id: image
      shell: bash
      run: echo "version=$ImageVersion" >> $GITHUB_OUTPUT

    # The source and build trees left beside each dependency built in deps/ are most of its size and not needed again
    - name: Cache built prerequisites for ubuntu
      uses: actions/cache@v6
      with:
        path: |
          ${{env.PREREQS_INSTALL_DIR}}
          ~/.m2/repository
          ${{github.workspace}}/deps
          !${{github.workspace}}/deps/*/*/*/src
          !${{github.workspace}}/deps/*/*/*/tmp
        key: ubuntu-codeql-cache-prereqs-v3-${{steps.image.outputs.version}}
        restore-keys: ubuntu-codeql-cache-prereqs-v3-

    - name: Build GenomicsDB
      shell: bash
      run: |
        $GITHUB_WORKSPACE/.github/scripts/cleanup_hosts.sh
        echo "Install Prerequisites for Linux.."
        pushd $GITHUB_WORKSPACE/scripts/prereqs
        sudo INSTALL_PREFIX=$PREREQS_INSTALL_DIR PREREQS_ENV=$PREREQS_ENV ./install_prereqs.sh
        popd
        echo "Install prerequisites for Linux DONE"
        source $PREREQS_ENV
        cmake $GITHUB_WORKSPACE -DCMAKE_PREFIX_PATH=$PREREQS_INSTALL_DIR -DBUILD_JAVA=1 -DCMAKE_INSTALL_PREFIX=$CMAKE_INSTALL_PREFIX
        # One make: htslib re-runs autoreconf on every make, so a second one relinks everything and rebuilds the jars
        make -j4 install
        rm -fr dependencies/ src/test/ test/

    # Autobuild attempts to build any compiled languages  (C/C++, C#, or Java).
    # If this step fails, then you should remove it and run the build manually (see below)
    # - name: Autobuild
    #  uses: github/codeql-action/autobuild@v1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
