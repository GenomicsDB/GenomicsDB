name: Publish release

# Publishes the release's jars to Maven Central through the Central Portal (scripts/release), and adds the all-in-one
# jar to the tag's GitHub release. The all-in-one jar bundles Spark and Hadoop and is too big for Maven Central's
# publishing limits. The two are separate jobs so that either can be re-run on its own.
on:
  workflow_call:
    inputs:
      release_artifact:
        required: true
        type: string
    secrets:
      MAVEN_GPG_PASSPHRASE:
        required: true
      MAVEN_GPG_PRIVATE_KEY:
        required: true
      # A Central Portal user token, from https://central.sonatype.com/usertoken
      CENTRAL_TOKEN_USERNAME:
        required: true
      CENTRAL_TOKEN_PASSWORD:
        required: true

jobs:
  maven-central:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set the version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [[ $VERSION == *SNAPSHOT ]]; then
            echo "Maven Central does not take SNAPSHOT versions as releases" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # Secrets passed with "secrets: inherit" aren't checked against "required", and the Portal only answers 401
      - name: Check the secrets are set
        run: |
          for secret in MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "The repository secret $secret is not set" >&2
              exit 1
            fi
          done
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.release_artifact }}
          path: release

      - name: Import the signing key
        run: gpg --batch --import <<< "$MAVEN_GPG_PRIVATE_KEY"
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}

      - name: Publish to Maven Central
        run: |
          scripts/release/central_bundle.sh "$VERSION" release bundle.zip
          scripts/release/central_upload.sh bundle.zip "genomicsdb-$VERSION"
        env:
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}

  github-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.release_artifact }}
          path: release

      - name: Add the all-in-one jar to the GitHub release
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag
          fi
          gh release upload "$GITHUB_REF_NAME" "release/genomicsdb-${GITHUB_REF_NAME#v}-allinone-spark.jar" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
