name: Release

on:
  push:
    tags:
      - v*

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_message: ${{ steps.version.outputs.tag_message }}
    steps:
      - uses: actions/checkout@v7

      # A tag v1.6.0 releases version 1.6.0; a tag message containing skip-gatk-it skips GATK's tests
      - id: version
        run: |
          git fetch --tags --force
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          { echo "tag_message<<EOF"; git tag -l --format='%(contents)' "$GITHUB_REF_NAME"; echo "EOF"; } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/distributable.yml
    with:
      version: ${{ needs.version.outputs.version }}

  test:
    needs: [version, build]
    uses: ./.github/workflows/release_test.yml
    with:
      release_artifact: genomicsdb-jars
      tag_message: ${{ needs.version.outputs.tag_message }}

  publish:
    needs: test
    uses: ./.github/workflows/release_publish.yml
    with:
      release_artifact: genomicsdb-jars
    secrets: inherit
